[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sidetrack"
version = "0.1.0"
description = "A Field Guide to Getting Sidetracked"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "jinja2>=3.1.0",
    "osmnx>=1.9.0",
    "python-igraph>=0.11.0",
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["apps/web", "packages"]

[tool.pytest.ini_options]
addopts = "-n auto --import-mode=importlib -ra"
testpaths = ["apps/web/tests", "packages/ovon_core/tests"]
pythonpath = [".", "apps/web", "packages"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "."
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
