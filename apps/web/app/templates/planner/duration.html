<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="intent-header" style="text-align: left; margin-bottom: 1.5rem;">
    <h2 tabindex="-1">How long do you want to get sidetracked?</h2>
    <p>Starting from <strong>{{ origin }}</strong></p>
  </div>

  {% if error %}
  <div style="background: rgba(225, 29, 72, 0.2); border: 1px solid #f43f5e; color: #fecdd3; padding: 0.85rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; font-size: 0.9rem;">
    <strong>Location or Time Error:</strong> {{ error }}
  </div>
  {% endif %}

  <form hx-post="{{ url_for('planner.planning') }}" hx-target="#planner-container" hx-swap="innerHTML">
    <input type="hidden" name="origin" value="{{ origin }}">

    <div class="form-group">
      <label for="duration-select">Walking Time Budget</label>
      <select id="duration-select" name="duration" class="input-text" style="cursor: pointer;">
        <option value="30">30 minutes (~1.2 km)</option>
        <option value="45" selected>45 minutes (~2.0 km) — Recommended</option>
        <option value="60">60 minutes (~2.8 km)</option>
        <option value="90">90 minutes (~4.2 km)</option>
      </select>
    </div>

    <!-- Optional collapsed preferences via Alpine.js -->
    <div x-data="{ expanded: false }" style="margin-top: 1.5rem; border-top: 1px solid var(--border-card); padding-top: 1rem;">
      <button type="button" @click="expanded = !expanded" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.4rem 0.8rem;">
        <span x-text="expanded ? '− Hide optional preferences' : '+ Anything we should know? (Accessibility/Comfort)'"></span>
      </button>

      <div x-show="expanded" x-transition style="margin-top: 1rem; font-size: 0.9rem; color: var(--brand-sky);">
        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
          <input type="checkbox" name="paved_only" value="true" disabled> Require paved / flat trails only <em>(Coming soon)</em>
        </label>
        <label style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" name="quiet_mode" value="true" disabled> Favor quiet routes away from traffic noise <em>(Coming soon)</em>
        </label>
      </div>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
      <a href="{{ url_for('planner.origin') }}" class="btn btn-secondary">
        ← Back
      </a>
      <button type="submit" class="btn btn-primary" style="flex: 1;">
        Show Me Three Ways To Go ✨
      </button>
    </div>
  </form>
</div>
