<div class="card" style="max-width: 650px; margin: 0 auto;">
  <div class="intent-header" style="text-align: left; margin-bottom: 1.5rem;">
    <h2 tabindex="-1" style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.4rem;">Where should we start?</h2>
    <p style="color: var(--brand-sky); font-size: 0.95rem;">Select a public park preset, enter an address, or use your browser location.</p>
  </div>

  <!-- Privacy Guarantee Banner -->
  <div style="background: rgba(88, 125, 113, 0.15); border: 1px solid rgba(88, 125, 113, 0.3); padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.6rem;">
    <span style="font-size: 1.1rem;">🔒</span>
    <span style="font-size: 0.82rem; color: var(--brand-sky);">
      <strong>Privacy Protection:</strong> Exact street addresses are processed in-memory into coarse park bounds and are <strong>never stored in databases or server logs</strong>.
    </span>
  </div>

  <!-- Quick Public Park Presets -->
  <div style="margin-bottom: 1.5rem;">
    <label style="display: block; font-weight: 600; font-size: 0.85rem; color: var(--brand-sky); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em;">
      🌱 Popular Public Parks
    </label>
    <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
      <button type="button" onclick="setOriginPreset('Loose Park, Kansas City, MO')" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 999px;">
        🌳 Loose Park (KC)
      </button>
      <button type="button" onclick="setOriginPreset('Mill Creek Park, Kansas City, MO')" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 999px;">
        ⛲ Mill Creek Park
      </button>
      <button type="button" onclick="setOriginPreset('Swope Park, Kansas City, MO')" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 999px;">
        🌲 Swope Park
      </button>
      <button type="button" onclick="setOriginPreset('Overland Park Arboretum, KS')" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 999px;">
        🌺 OP Arboretum
      </button>
    </div>
  </div>

  <form action="{{ url_for('planner.duration') }}" method="GET" hx-get="{{ url_for('planner.duration') }}" hx-target="#planner-container" hx-swap="innerHTML" hx-push-url="true">
    <div class="form-group">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
        <label for="origin-input" style="margin-bottom: 0;">Starting Location or Address</label>
        <button type="button" onclick="useBrowserLocation()" style="background: none; border: none; color: var(--brand-green); font-size: 0.85rem; cursor: pointer; font-weight: 600; text-decoration: underline;">
          📍 Use My Location
        </button>
      </div>
      <input type="text" 
             id="origin-input" 
             name="origin" 
             class="input-text" 
             placeholder="e.g. Loose Park, Kansas City, MO" 
             value="Loose Park, Kansas City, MO" 
             required>
      <div id="location-msg" style="font-size: 0.8rem; color: var(--brand-sky); margin-top: 0.4rem; display: none;"></div>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
      <a href="{{ url_for('planner.index') }}" class="btn btn-secondary">
        ← Back
      </a>
      <button type="submit" class="btn btn-primary" style="flex: 1;">
        Next: Choose Time Budget →
      </button>
    </div>
  </form>
</div>

<script>
  function setOriginPreset(name) {
    const input = document.getElementById('origin-input');
    if (input) {
      input.value = name;
      input.focus();
    }
  }

  function useBrowserLocation() {
    const msg = document.getElementById('location-msg');
    const input = document.getElementById('origin-input');
    
    if (!navigator.geolocation) {
      if (msg) {
        msg.style.display = 'block';
        msg.style.color = '#ef4444';
        msg.innerText = 'Geolocation is not supported by your browser. Please select a park preset above.';
      }
      return;
    }

    if (msg) {
      msg.style.display = 'block';
      msg.style.color = 'var(--brand-sky)';
      msg.innerText = 'Requesting browser location permission...';
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude.toFixed(4);
        const lon = pos.coords.longitude.toFixed(4);
        if (input) {
          input.value = `Current Location (${lat}, ${lon})`;
        }
        if (msg) {
          msg.style.color = '#10b981';
          msg.innerText = '✓ Location updated!';
        }
      },
      (err) => {
        if (msg) {
          msg.style.color = '#eab308';
          msg.innerText = 'Location access declined. Please choose a public park preset above or type a place name.';
        }
      },
      { timeout: 8000 }
    );
  }
</script>
