<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="intent-header" style="text-align: left; margin-bottom: 1.5rem;">
    <h2>Where should we start?</h2>
    <p>Enter an address, public place, or use your current location.</p>
  </div>

  <form hx-post="{{ url_for('planner.duration') }}" hx-target="#planner-container" hx-swap="innerHTML">
    <div class="form-group">
      <label for="origin-input">Starting Location</label>
      <input type="text" 
             id="origin-input" 
             name="origin" 
             class="input-text" 
             placeholder="e.g. Loose Park, Swope Park, or address in KC" 
             value="Loose Park, Kansas City, MO" 
             required>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
      <button type="button" class="btn btn-secondary" hx-get="{{ url_for('planner.index') }}" hx-target="#planner-container" hx-swap="innerHTML">
        ← Back
      </button>
      <button type="submit" class="btn btn-primary" style="flex: 1;">
        Next: Choose Time Budget →
      </button>
    </div>
  </form>
</div>
